name: Deploy Backend

on:
  push:
    branches: [ dev ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Docker Login to ACR
      run: docker login traktempo.azurecr.io \
        -u ${{ secrets.ACR_USERNAME }} \
        -p ${{ secrets.ACR_PASSWORD }}

    - name: Build Image
      run: docker build -t traktempo.azurecr.io/backend:${{ github.sha }} .

    - name: Push Image
      run: docker push traktempo.azurecr.io/backend:${{ github.sha }}

    - name: Deploy to VM
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USERNAME }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          docker login traktempo.azurecr.io -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }}
          docker pull traktempo.azurecr.io/backend:${{ github.sha }}
          docker stop backend || true
          docker rm backend || true
          docker run -d -p 5000:5000 \
          --name backend \
          traktempo.azurecr.io/backend:${{ github.sha }}
